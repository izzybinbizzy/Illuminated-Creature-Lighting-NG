; ============================================================================
;  Illuminated - Creature Lighting NG - Advanced Settings (file version 1)
; ============================================================================
;  Fine values the in-game menu does not show. The game reads this file once,
;  when it starts.
;
;  TO CHANGE A VALUE: change the number after the = and save, then start the
;  game. The note above each value says what it does; its default and allowed
;  range are written beside it. A value outside its range is held at the
;  nearest end.
;
;  TO RESET A VALUE: delete its line, or the whole file, and the default
;  comes back - unless the Custom file (below) sets it: take the line out
;  there too.
;
;  TO KEEP CHANGES THROUGH UPDATES: an update replaces this file. Put
;  only the changed lines, under their [Section], in a file of their own
;  beside this one:
;    Illuminated - Creature Lighting NG - Advanced Settings - Custom.ini
;  Its lines win over this file, and no update touches it.
;
;  The menu's own settings (its sliders and switches) stay in the menu.
; ============================================================================
;
;  CONTENTS
;    1. Flicker
;    2. Fade on death
;    3. Glow when casting
;    4. Dark until noticed
;    5. Performance
;
;  MOST PEOPLE ONLY CHANGE THESE
;    FlickerSwing   in [Flicker]
;    FadeUpSeconds  in [Dark until noticed]
;    LitCreatures   in [Performance]
;
; ============================================================================

; ----------------------------------------------------------------------------
;  1. FLICKER
;  How lights flicker and pulse.
; ----------------------------------------------------------------------------
[Flicker]

; How much a creature's flicker swings: 1 as made, 0.5 half as much, 0 steady.
FlickerSwing = 1  ; default 1 - range 0 to 2

; ----------------------------------------------------------------------------
;  2. FADE ON DEATH
;  How a dying creature's light fades out.
; ----------------------------------------------------------------------------
[Fade on death]

; How many seconds a dying creature's light takes to fade.
FadeSeconds = 4     ; default 4 - range 0.5 to 20

; How much light a flame creature's remains keep, as a share of its glow.
EmberShare  = 0.25  ; default 0.25 - range 0 to 1

; ----------------------------------------------------------------------------
;  3. GLOW WHEN CASTING
;  How a creature's light brightens while it casts or breathes.
; ----------------------------------------------------------------------------
[Glow when casting]

; How many seconds the glow when casting lasts.
SurgeSeconds = 0.6  ; default 0.6 - range 0.3 to 3

; How much brighter a creature glows at the peak of a cast: 0.6 is 60 percent brighter.
SurgeLift    = 0.6  ; default 0.6 - range 0 to 2

; ----------------------------------------------------------------------------
;  4. DARK UNTIL NOTICED
;  How a creature's light waits dark, then fades up when it notices the player.
; ----------------------------------------------------------------------------
[Dark until noticed]

; How bright a creature glows while it searches for the player, as a share of its full glow.
SearchingShare  = 0.5  ; default 0.5 - range 0 to 1

; How many seconds a creature's light takes to fade up when it notices the player.
FadeUpSeconds   = 1.5  ; default 1.5 - range 0.2 to 10

; How many seconds a creature's light takes to fade down when it calms.
FadeDownSeconds = 3    ; default 3 - range 0.2 to 10

; ----------------------------------------------------------------------------
;  5. PERFORMANCE
;  Limits that keep big fights smooth.
; ----------------------------------------------------------------------------
[Performance]

; How many creatures nearest the player are lit at once on Community Shaders.
LitCreatures           = 16  ; default 16 - range 1 to 32

; How many creatures nearest the player are lit at once on ENB and Vanilla.
LitCreaturesENBVanilla = 5   ; default 5 - range 1 to 16

; How many torchbugs, jars of bugs and other glowing objects are lit at once on Community Shaders (no limit with RE::Light).
LitObjects             = 8   ; default 8 - range 0 to 16

; How many glowing objects are lit at once on ENB and Vanilla (no limit with RE::Light).
LitObjectsENBVanilla   = 2   ; default 2 - range 0 to 8
